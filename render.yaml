services:
  # Option A: Render Web Service (Recommended - Node.js Express server + SPA + /health endpoint)
  - type: web
    name: davetech-pos
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false

